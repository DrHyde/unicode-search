name: CI

on:
  push:
  pull_request:

jobs:
  determine-node-versions:
    runs-on: macos-latest
    outputs:
      versions: ${{ steps.versions.outputs.versions }}

    steps:
      - name: Determine Node.js versions
        id: versions
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import urllib.request

          with urllib.request.urlopen('https://nodejs.org/dist/index.json') as response:
              releases = json.load(response)

          # Get latest LTS versions (even majors: 22, 24, 26...)
          latest_by_major = {}
          for release in releases:
              version = release['version'].lstrip('v')
              major = int(version.split('.')[0])
              if major % 2 == 0:
                  latest_by_major.setdefault(major, version)
                  if len(latest_by_major) == 3:
                      break

          selected = [latest_by_major[major] for major in sorted(latest_by_major, reverse=True)]

          # Get the very latest version (any major) if not already included
          latest_version = None
          for release in releases:
              version = release['version'].lstrip('v')
              major = int(version.split('.')[0])
              if version > (latest_version or '0.0.0'):
                  latest_version = version

          if latest_version and latest_version not in selected:
              selected.append(latest_version)

          print(f"versions={json.dumps(selected)}")
          PY

  test:
    needs: determine-node-versions
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ${{ fromJson(needs.determine-node-versions.outputs.versions) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js (${{ matrix.node-version }})
        uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium firefox webkit

      - name: Run tests
        run: npm test

      - name: Run lint
        run: npm run lint
